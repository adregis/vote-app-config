apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app: pipelines-vote-ui
  name: pipelines-vote-ui
  namespace: app-vote-dev
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    blueGreen:
      activeService: pipelines-vote-ui         # Service principal de produção
      previewService: pipelines-vote-ui-preview # Service para validação prévia
      autoPromotionEnabled: false # Exige comando manual para trocar as chaves
  selector:
    matchLabels:
      app: pipelines-vote-ui
  template:
    metadata:
      labels:
        app: pipelines-vote-ui
    spec:
      containers:
        - name: pipelines-vote-ui
          image: image-registry.openshift-image-registry.svc:5000/pipelines-tutorial/pipelines-vote-ui:c9b677a8eca93b4e6f7654390fbb815dcb63f29a
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              protocol: TCP
          env:
            - name: VOTING_API_SERVICE_HOST
              value: pipelines-vote-api
            - name: VOTING_API_SERVICE_PORT
              value: "9000"