apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/adregis/vote-app-config.git'
    targetRevision: HEAD
    path: k8s/prod     
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-vote 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true